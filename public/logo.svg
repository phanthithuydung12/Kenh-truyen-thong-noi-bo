<svg width="208" height="51" viewBox="0 0 208 51" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradients for the 3D Polyhedron Faces -->
    <linearGradient id="g-top" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="g-right" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="g-bottom" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="g-left" x1="100%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.85"/>
    </linearGradient>
    
    <!-- Central AI Glow -->
    <radialGradient id="g-core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#22d3ee" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>

    <!-- Typography Core Gradient -->
    <linearGradient id="g-text-core" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>

    <!-- Style for Theme-Adaptive Text -->
    <style>
      .text-nova {
        font-family: 'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-weight: 800;
        font-size: 23px;
        fill: #1e293b; /* Dark slate in light mode */
      }
      .text-core {
        font-family: 'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-weight: 800;
        font-size: 23px;
        fill: url(#g-text-core);
      }
      .text-tech {
        font-family: 'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-weight: 700;
        font-size: 7.5px;
        letter-spacing: 3.5px;
        fill: #64748b; /* Slate gray in light mode */
      }
      @media (prefers-color-scheme: dark) {
        .text-nova {
          fill: #f8fafc; /* Crisp white in dark mode */
        }
        .text-tech {
          fill: #94a3b8; /* Light gray in dark mode */
        }
      }
    </style>
  </defs>

  <!-- ================= ICON / EMBLEM ================= -->
  <g transform="translate(5, 5)">
    <!-- Base Glow -->
    <circle cx="20" cy="20" r="18" fill="url(#g-core)" opacity="0.6"/>

    <!-- Overlapping Polyhedron Faces -->
    <polygon points="20,20 20,2 35.6,11" fill="url(#g-top)"/>
    <polygon points="20,20 35.6,11 35.6,29" fill="url(#g-right)"/>
    <polygon points="20,20 35.6,29 20,38" fill="url(#g-right)"/>
    <polygon points="20,20 20,38 4.4,29" fill="url(#g-bottom)"/>
    <polygon points="20,20 4.4,29 4.4,11" fill="url(#g-left)"/>
    <polygon points="20,20 4.4,11 20,2" fill="url(#g-top)"/>

    <!-- Inner Core Spark (Glowing AI Node) -->
    <circle cx="20" cy="20" r="5" fill="#22d3ee" opacity="0.8"/>
    <circle cx="20" cy="20" r="2.5" fill="#ffffff"/>
    
    <!-- Geometric Overlay lines for high-tech look -->
    <line x1="20" y1="2" x2="20" y2="38" stroke="#ffffff" stroke-width="0.7" stroke-opacity="0.3"/>
    <line x1="4.4" y1="11" x2="35.6" y2="29" stroke="#ffffff" stroke-width="0.7" stroke-opacity="0.3"/>
    <line x1="4.4" y1="29" x2="35.6" y2="11" stroke="#ffffff" stroke-width="0.7" stroke-opacity="0.3"/>
    <polygon points="20,2 35.6,11 35.6,29 20,38 4.4,29 4.4,11" fill="none" stroke="#ffffff" stroke-width="1.2" stroke-opacity="0.6"/>
  </g>

  <!-- ================= TYPOGRAPHY ================= -->
  <text x="56" y="27" class="text-nova">NOVA</text>
  <text x="122" y="27" class="text-core">CORE</text>
  <text x="57" y="40" class="text-tech">TECHNOLOGIES</text>
</svg>
